<!DOCTYPE html>
<html>
    <head>
        <title>Home - HumanLine</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            /* General Styles */
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f9f9f9;
                color: #333;
            }

            /* Container */
            .container {
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            /* Headings */
            h1 {
                color: #007bff;
                font-size: 2.5em;
                margin-bottom: 20px;
            }

            p {
                font-size: 1.2em;
            }
        </style>
    </head>
    <body>
        <!-- Include the navigation menu -->
        <div id="menu"></div>
        <script>
            fetch('menu.html')
                .then(response => response.text())
                .then(html => document.getElementById('menu').innerHTML = html);

            // Restrict access to logged-in users only
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!user) {
                alert("Please log in to access this page.");
                window.location.href = "index.html";
            } else if (user.role === "admin") {
                alert("Admins cannot access this page.");
                window.location.href = "admin.html";
            }
        </script>

        <!-- Main Content -->
        <div class="container">
            <h1>Welcome to HumanLine</h1>
            <p>This is the home page of HumanLine, your go-to platform for real-time chat and premium services.</p>
        </div>

        <!-- Footer -->
        <footer>
            &copy; 2025 HumanLine. All rights reserved.
        </footer>
    </body>
</html>
