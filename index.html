<!DOCTYPE html>
<html>
    <head>
        <title>Login - HumanLine</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            .login-container {
                max-width: 400px;
                margin: 100px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            .login-container img {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
                border-radius: 50%;
            }

            .login-container h1 {
                font-size: 24px;
                margin-bottom: 20px;
                color: #007bff;
            }

            .login-container input {
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }

            .login-container button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            .login-container button:hover {
                background-color: #0056b3;
            }

            .login-container a {
                display: block;
                margin-top: 10px;
                color: #007bff;
                text-decoration: none;
            }

            .login-container a:hover {
                text-decoration: underline;
            }

            #errorMessage {
                color: red;
                margin-top: 10px;
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <img src="https://th.bing.com/th/id/OIP.Sc3O8n6bPeo51ns8GRaiLwHaHa?rs=1&pid=ImgDetMain" alt="Parrot Logo">
            <h1>Welcome to HumanLine</h1>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="errorMessage">Invalid credentials</p>
            <a href="signup.html">Sign Up</a>
            <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <script>
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password }),
                    });

                    if (response.ok) {
                        const data = await response.json();
                        alert('Login successful! Redirecting...');
                        localStorage.setItem('loggedInUser', JSON.stringify(data.user));

                        // Redirect based on role
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'chat.html';
                        }
                    } else {
                        const error = await response.json();
                        document.getElementById('errorMessage').textContent = error.error;
                        document.getElementById('errorMessage').style.display = 'block';
                    }
                } catch (err) {
                    alert('An error occurred. Please try again later.');
                }
            });
        </script>
    </body>
</html>
