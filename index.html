<!DOCTYPE html>
<html>
    <head>
        <title>Login - HumanLine</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            .login-container {
                max-width: 400px;
                margin: 100px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            .login-container img {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
                border-radius: 50%;
            }

            .login-container h1 {
                font-size: 24px;
                margin-bottom: 20px;
                color: #007bff;
            }

            .login-container input {
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }

            .login-container button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            .login-container button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <img src="https://th.bing.com/th/id/OIP.Sc3O8n6bPeo51ns8GRaiLwHaHa?rs=1&pid=ImgDetMain" alt="Parrot Logo">
            <h1>Welcome to HumanLine</h1>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="errorMessage" style="color: red; display: none;">Invalid credentials</p>
        </div>

        <script type="module">
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Load users from localStorage
                const users = JSON.parse(localStorage.getItem('users')) || [];

                // Check if the entered credentials match any user
                const user = users.find(u => u.username === username && u.password === password);

                if (user) {
                    alert('Login successful!');
                    localStorage.setItem('loggedInUser', JSON.stringify(user));
                    if (user.role === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "home.html";
                    }
                } else {
                    document.getElementById('errorMessage').style.display = 'block';
                }
            });
        </script>
    </body>
</html>
