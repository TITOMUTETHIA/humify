<!DOCTYPE html>
<html>
    <head>
        <title>Chat - HumanLine</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            .chat-container {
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .chat-header {
                text-align: center;
                margin-bottom: 20px;
            }

            .chat-messages {
                height: 300px;
                overflow-y: auto;
                border: 1px solid #ddd;
                padding: 10px;
                margin-bottom: 20px;
                background: #f9f9f9;
                border-radius: 4px;
            }

            .chat-message {
                margin-bottom: 10px;
                padding: 10px;
                border-radius: 4px;
                background: #e9ecef;
            }

            .chat-message.sender {
                background: #007bff;
                color: white;
                text-align: right;
            }

            .chat-input {
                display: flex;
                gap: 10px;
            }

            .chat-input input {
                flex: 1;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }

            .chat-input button {
                padding: 10px 20px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            .chat-input button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <!-- Include the navigation menu -->
        <div id="menu"></div>
        <script>
            fetch('menu.html')
                .then(response => response.text())
                .then(html => document.getElementById('menu').innerHTML = html);

            // Restrict access to logged-in users only
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!user) {
                alert("Please log in to access this page.");
                window.location.href = "index.html";
            }
        </script>

        <!-- Main Content -->
        <div class="chat-container">
            <div class="chat-header">
                <h1>Welcome to the Chat</h1>
                <p>Logged in as: <strong id="currentUser"></strong></p>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="recipient" placeholder="Recipient's Username" required>
                <input type="text" id="messageInput" placeholder="Type a message..." required>
                <button id="sendButton">Send</button>
            </div>
        </div>

        <script>
            const currentUser = JSON.parse(localStorage.getItem('loggedInUser'));
            document.getElementById('currentUser').textContent = currentUser.username;

            const chatMessages = document.getElementById('chatMessages');
            const recipientInput = document.getElementById('recipient');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');

            // Load messages from localStorage
            const loadMessages = () => {
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                chatMessages.innerHTML = '';
                messages.forEach((message) => {
                    if (message.sender === currentUser.username || message.recipient === currentUser.username) {
                        const messageDiv = document.createElement('div');
                        messageDiv.className = `chat-message ${message.sender === currentUser.username ? 'sender' : ''}`;
                        messageDiv.textContent = `${message.sender}: ${message.text}`;
                        chatMessages.appendChild(messageDiv);
                    }
                });
            };

            // Save messages to localStorage
            const saveMessages = (messages) => {
                localStorage.setItem('messages', JSON.stringify(messages));
            };

            // Send a message
            const sendMessage = () => {
                const recipient = recipientInput.value.trim();
                const text = messageInput.value.trim();

                if (!recipient || !text) {
                    alert('Please enter a recipient and a message.');
                    return;
                }

                if (recipient === currentUser.username) {
                    alert('You cannot send a message to yourself.');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('users')) || [];
                const recipientExists = users.some((user) => user.username === recipient);

                if (!recipientExists) {
                    alert('Recipient does not exist.');
                    return;
                }

                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push({ sender: currentUser.username, recipient, text });
                saveMessages(messages);
                messageInput.value = '';
                loadMessages();
            };

            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // Load messages on page load
            loadMessages();
        </script>
    </body>
</html>
