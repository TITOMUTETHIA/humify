<!DOCTYPE html>
<html>
    <head>
        <title>Chat - HumanLine</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            .chat-container {
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .chat-header {
                text-align: center;
                margin-bottom: 20px;
            }

            .chat-messages {
                height: 300px;
                overflow-y: auto;
                border: 1px solid #ddd;
                padding: 10px;
                margin-bottom: 20px;
                background: #f9f9f9;
                border-radius: 4px;
            }

            .chat-message {
                margin-bottom: 10px;
                padding: 10px;
                border-radius: 4px;
                background: #e9ecef;
            }

            .dropdown {
                position: relative;
                display: inline-block;
            }

            .dropdown-content {
                display: none;
                position: absolute;
                background-color: #f9f9f9;
                min-width: 160px;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
                z-index: 1;
                border-radius: 4px;
            }

            .dropdown-content a {
                color: black;
                padding: 12px 16px;
                text-decoration: none;
                display: block;
            }

            .dropdown-content a:hover {
                background-color: #f1f1f1;
            }

            .dropdown:hover .dropdown-content {
                display: block;
            }

            .dropdown:hover .dropbtn {
                background-color: #007bff;
                color: white;
            }

            .search-container {
                margin-bottom: 20px;
            }

            .search-container input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <!-- Dropdown Menu -->
        <div class="dropdown">
            <button class="dropbtn">Menu</button>
            <div class="dropdown-content" id="menuLinks">
                <!-- Links will be dynamically added here -->
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h1>Welcome to the Chat</h1>
                <p>Logged in as: <strong id="currentUser"></strong></p>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for a user..." oninput="searchUsers()">
                <ul id="searchResults"></ul>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="recipient" placeholder="Recipient's Username" required>
                <input type="text" id="messageInput" placeholder="Type a message..." required>
                <button id="sendButton">Send</button>
            </div>
        </div>

        <script>
            const currentUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!currentUser) {
                alert('Please log in to access this page.');
                window.location.href = 'index.html';
            }

            document.getElementById('currentUser').textContent = currentUser.username;

            // Dynamically populate the dropdown menu
            const menuLinks = document.getElementById('menuLinks');
            const pages = [
                { name: 'Home', url: 'home.html' },
                { name: 'About', url: 'about.html' },
                { name: 'Contact', url: 'contact.html' },
            ];

            pages.forEach(page => {
                const link = document.createElement('a');
                link.href = page.url;
                link.textContent = page.name;
                menuLinks.appendChild(link);
            });

            // Only add the admin page if the user is an admin
            if (currentUser.role === 'admin') {
                const adminLink = document.createElement('a');
                adminLink.href = 'admin.html';
                adminLink.textContent = 'Admin';
                menuLinks.appendChild(adminLink);
            }

            // Chat functionality (similar to the previous implementation)
            const chatMessages = document.getElementById('chatMessages');
            const recipientInput = document.getElementById('recipient');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');

            const loadMessages = () => {
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                chatMessages.innerHTML = '';
                messages.forEach(message => {
                    if (message.sender === currentUser.username || message.recipient === currentUser.username) {
                        const messageDiv = document.createElement('div');
                        messageDiv.className = `chat-message ${message.sender === currentUser.username ? 'sender' : ''}`;
                        messageDiv.textContent = `${message.sender}: ${message.text}`;
                        chatMessages.appendChild(messageDiv);
                    }
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            const saveMessages = messages => {
                localStorage.setItem('messages', JSON.stringify(messages));
            };

            const sendMessage = () => {
                const recipient = recipientInput.value.trim();
                const text = messageInput.value.trim();

                if (!recipient || !text) {
                    alert('Please enter a recipient and a message.');
                    return;
                }

                if (recipient === currentUser.username) {
                    alert('You cannot send a message to yourself.');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('users')) || [];
                const recipientExists = users.some(user => user.username === recipient);

                if (!recipientExists) {
                    alert('Recipient does not exist.');
                    return;
                }

                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push({ sender: currentUser.username, recipient, text });
                saveMessages(messages);
                messageInput.value = '';
                loadMessages();
            };

            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') sendMessage();
            });

            loadMessages();

            // Search functionality
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');

            const searchUsers = () => {
                const query = searchInput.value.toLowerCase();
                const users = JSON.parse(localStorage.getItem('users')) || [];
                searchResults.innerHTML = '';

                users.forEach(user => {
                    if (user.username.toLowerCase().includes(query)) {
                        const resultItem = document.createElement('li');
                        resultItem.textContent = user.username;
                        searchResults.appendChild(resultItem);
                    }
                });
            };
        </script>
    </body>
</html>
