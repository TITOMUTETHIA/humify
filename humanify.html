<!DOCTYPE html>
<html>
    <head>
        <title>Humanify - Welcome</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            .humanify-container {
                max-width: 600px;
                margin: 100px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            .humanify-container h1 {
                font-size: 32px;
                margin-bottom: 20px;
                color: #007bff;
            }

            .humanify-container p {
                font-size: 18px;
                margin-bottom: 30px;
                color: #333;
            }

            .humanify-container button {
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }

            .humanify-container button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="humanify-container">
            <h1>Welcome to Humanify</h1>
            <p>
                Humanify is your go-to platform for real-time chat and premium services. 
                Connect with others, share ideas, and enjoy seamless communication.
            </p>
            <button onclick="window.location.href='signup.html'">Sign Up</button>
            <button onclick="window.location.href='index.html'">Log In</button>
        </div>
    </body>
</html>
