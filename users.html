<!DOCTYPE html>
<html>
    <head>
        <title>Manage Users - HumanLine</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            .admin-container {
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .admin-container h1 {
                color: #007bff;
                font-size: 2.5em;
                margin-bottom: 20px;
            }

            .user-list table {
                width: 100%;
                border-collapse: collapse;
            }

            .user-list th, .user-list td {
                border: 1px solid #ddd;
                padding: 10px;
                text-align: left;
            }

            .user-list th {
                background-color: #f4f4f4;
            }

            .user-actions button {
                margin-right: 5px;
                padding: 5px 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            .user-actions button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <!-- Include the navigation menu -->
        <div id="menu"></div>
        <script>
            fetch('menu.html')
                .then(response => response.text())
                .then(html => document.getElementById('menu').innerHTML = html);

            // Restrict access to admin users only
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!user || user.role !== "admin") {
                alert("Access denied! Admins only.");
                window.location.href = "index.html";
            }
        </script>

        <!-- Main Content -->
        <div class="admin-container">
            <h1>Manage Users</h1>
            <div class="user-list">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <!-- User rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>
            <div>
                <h2>Add New User</h2>
                <form id="addUserForm">
                    <input type="text" id="newUsername" placeholder="Username" required>
                    <input type="password" id="newPassword" placeholder="Password" required>
                    <select id="newRole">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button type="submit">Add User</button>
                </form>
            </div>
        </div>

        <script>
            // Load users from localStorage
            const loadUsers = () => {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const userTable = document.getElementById('userTable');
                userTable.innerHTML = '';
                users.forEach((user, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.username}</td>
                        <td>${user.role}</td>
                        <td class="user-actions">
                            <button onclick="editUser(${index})">Edit</button>
                            <button onclick="deleteUser(${index})" style="background-color: red;">Delete</button>
                        </td>
                    `;
                    userTable.appendChild(row);
                });
            };

            // Save users to localStorage
            const saveUsers = (users) => {
                localStorage.setItem('users', JSON.stringify(users));
            };

            // Add a new user
            document.getElementById('addUserForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('newUsername').value;
                const password = document.getElementById('newPassword').value;
                const role = document.getElementById('newRole').value;

                const users = JSON.parse(localStorage.getItem('users')) || [];
                users.push({ username, password, role });
                saveUsers(users);
                loadUsers();
                alert('User added successfully!');
                e.target.reset();
            });

            // Edit a user
            const editUser = (index) => {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const username = prompt('Enter new username:', users[index].username);
                if (username) {
                    users[index].username = username;
                    saveUsers(users);
                    loadUsers();
                    alert('User updated successfully!');
                }
            };

            // Delete a user
            const deleteUser = (index) => {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                if (confirm('Are you sure you want to delete this user?')) {
                    users.splice(index, 1);
                    saveUsers(users);
                    loadUsers();
                    alert('User deleted successfully!');
                }
            };

            // Load users on page load
            loadUsers();
        </script>
    </body>
</html>
